<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS IVS 低レイテンシー配信 & 視聴</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { display: flex; gap: 40px; flex-wrap: wrap; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        video, canvas { width: 400px; height: 300px; background: #000; border-radius: 4px; }
        button { display: block; margin-top: 10px; padding: 10px; cursor: pointer; }
        select { display: block; margin-top: 10px; padding: 8px; }
        .status { margin-top: 10px; font-size: 0.9em; color: #a00; min-height: 1.2em; }
        table { border-collapse: collapse; margin-top: 10px; width: 100%; font-size: 0.9em; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
        td button { display: inline-block; margin: 0 4px 0 0; padding: 4px 8px; }
    </style>
</head>
<body>

<h1>AWS IVS 低レイテンシー デモ</h1>

<div class="container">
    <!-- 通信品質チェックエリア -->
    <div class="box">
        <h2>0. 配信前 通信品質チェック</h2>
        <p>S3上のダミーファイルを使って回線速度を計測し、1080p/720p/480pのどこまで配信できるか確認します。</p>
        <button id="quality-check-btn">通信速度をチェック</button>
        <p id="quality-check-status" class="status"></p>
        <div id="quality-check-result"></div>
    </div>

    <!-- 配信エリア -->
    <div class="box">
        <h2>1. 配信側 (Broadcast)</h2>
        <canvas id="preview"></canvas>

        <select id="channel-select">
            <option value="">チャネルを読み込み中...</option>
        </select>
        <button id="create-channel-btn">新規チャネル作成</button>

        <select id="preset-select">
            <option value="BASIC_LANDSCAPE">BASIC_LANDSCAPE (1280×720 / 30fps / 3.5Mbps / 横)</option>
            <option value="BASIC_FULL_HD_LANDSCAPE" selected>BASIC_FULL_HD_LANDSCAPE (1920×1080 / 30fps / 3.5Mbps / 横) ※視聴側で1080p/720pを選択するにはこちらを使用</option>
            <option value="STANDARD_LANDSCAPE">STANDARD_LANDSCAPE (1280×720 / 30fps / 2.5Mbps / 横)</option>
            <option value="BASIC_PORTRAIT">BASIC_PORTRAIT (720×1280 / 30fps / 3.5Mbps / 縦)</option>
            <option value="BASIC_FULL_HD_PORTRAIT">BASIC_FULL_HD_PORTRAIT (1080×1920 / 30fps / 3.5Mbps / 縦)</option>
            <option value="STANDARD_PORTRAIT">STANDARD_PORTRAIT (720×1280 / 30fps / 2.5Mbps / 縦)</option>
        </select>
        <button id="start-btn" disabled>配信開始</button>
        <button id="stop-broadcast-btn" disabled>配信停止</button>
        <button id="visibility-toggle-btn" disabled>プライベートに切替</button>
        <p id="broadcast-status" class="status"></p>
    </div>

    <!-- 視聴エリア -->
    <div class="box">
        <h2>2. 視聴側 (Player)</h2>
        <video id="video-player" controls playsinline></video>

        <select id="watch-channel-select">
            <option value="">チャネルを読み込み中...</option>
        </select>
        <button id="watch-btn" disabled>視聴開始</button>

        <select id="quality-select" disabled>
            <option value="">画質: 視聴開始後に選択可能</option>
        </select>
        <p id="watch-status" class="status"></p>
    </div>

    <!-- 運営者エリア -->
    <div class="box">
        <h2>3. 運営者 (Admin)</h2>
        <button id="admin-refresh-btn">一覧を更新</button>
        <table id="admin-channel-table">
            <thead>
            <tr>
                <th>チャネル名</th>
                <th>所有者</th>
                <th>公開設定</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="admin-channel-tbody">
            <tr><td colspan="4">読み込み中...</td></tr>
            </tbody>
        </table>
        <p id="admin-status" class="status"></p>
    </div>
</div>

<!-- .env から生成される環境変数 (npm run generate-config で生成、gitignore対象) -->
<script src="config.js"></script>

<!-- Amazon IVS SDK (UMDビルドのため通常のscriptタグで読み込み、グローバル変数として公開) -->
<script src="https://web-broadcast.live-video.net/1.39.0/amazon-ivs-web-broadcast.js"></script>
<script src="https://player.live-video.net/1.55.0/amazon-ivs-player.min.js"></script>

<!-- JavaScriptファイルの参照 -->
<script type="module" src="broadcast.js"></script>
<script type="module" src="player.js"></script>
<script type="module" src="admin.js"></script>
<script type="module" src="communication-quality.js"></script>

</body>
</html>
